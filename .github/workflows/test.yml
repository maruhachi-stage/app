name: Test

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - front-web
          - admin-web
          - back-api
          - image-server

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: テスト
        run: npm test

  integration:
    name: back-api-integration
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_NAME: hal_cinema_test
      DB_USER: hal_user
      DB_PASSWORD: hal_pass
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-api/package-lock.json

      - name: 依存関係をインストール
        working-directory: back-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: テスト用MySQLを起動
        working-directory: back-api
        run: npm run db:test:up

      - name: マイグレーションを適用
        working-directory: back-api
        run: npm run db:test:migrate

      - name: Integration Test
        working-directory: back-api
        run: npm run test:integration

      - name: テスト用MySQLを停止
        if: always()
        working-directory: back-api
        run: npm run db:test:down

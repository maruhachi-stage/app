name: CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 変更アプリを判定
    runs-on: ubuntu-latest
    outputs:
      front: ${{ steps.filter.outputs.front }}
      admin: ${{ steps.filter.outputs.admin }}
      back: ${{ steps.filter.outputs.back }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 変更パスを判定
        id: filter
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "front=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            echo "back=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA")"
          shared=false
          while IFS= read -r file; do
            case "$file" in
              .github/*|.editorconfig|AGENTS.md|README.md|SETUP.md)
                shared=true
                ;;
            esac
          done <<< "$files"

          for app in front admin back; do
            changed=false
            while IFS= read -r file; do
              case "$app:$file" in
                front:front-web/*|admin:admin-web/*|back:back-api/*)
                  changed=true
                  ;;
              esac
            done <<< "$files"
            if [ "$shared" = "true" ]; then changed=true; fi
            echo "$app=$changed" >> "$GITHUB_OUTPUT"
          done

  validate:
    name: ${{ matrix.app.name }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: front-web
            directory: front-web
            filter: front
          - name: admin-web
            directory: admin-web
            filter: admin
          - name: back-api
            directory: back-api
            filter: back

    defaults:
      run:
        working-directory: ${{ matrix.app.directory }}

    steps:
      - name: 変更有無を判定
        id: scope
        working-directory: .
        shell: bash
        run: |
          case "${{ matrix.app.filter }}" in
            front) echo "run=${{ needs.changes.outputs.front }}" >> "$GITHUB_OUTPUT" ;;
            admin) echo "run=${{ needs.changes.outputs.admin }}" >> "$GITHUB_OUTPUT" ;;
            back) echo "run=${{ needs.changes.outputs.back }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: リポジトリをチェックアウト
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app.directory }}/package-lock.json

      - name: 依存関係をインストール
        if: steps.scope.outputs.run == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: ビルド
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: 型チェック
        if: steps.scope.outputs.run == 'true'
        run: npm run typecheck

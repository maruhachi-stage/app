name: CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      front: ${{ steps.filter.outputs.front }}
      staff: ${{ steps.filter.outputs.staff }}
      back: ${{ steps.filter.outputs.back }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 変更アプリを判定
        id: filter
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "front=true" >> "$GITHUB_OUTPUT"
            echo "staff=true" >> "$GITHUB_OUTPUT"
            echo "back=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"

          shared=false
          while IFS= read -r file; do
            case "$file" in
              .github/*|.editorconfig|AGENTS.md|README.md|SETUP.md)
                shared=true
                ;;
            esac
          done <<< "$files"

          for app in front staff back; do
            changed=false
            while IFS= read -r file; do
              case "$app:$file" in
                front:front-web/*) changed=true ;;
                staff:staff-app/*) changed=true ;;
                back:back-api/*) changed=true ;;
              esac
            done <<< "$files"

            if [ "$shared" = "true" ]; then
              changed=true
            fi

            echo "$app=$changed" >> "$GITHUB_OUTPUT"
          done

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-web

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-web/package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  staff:
    name: Staff
    needs: changes
    if: needs.changes.outputs.staff == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staff-app

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: staff-app/package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-api

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: back-api/package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

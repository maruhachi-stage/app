services:
  mysql-test:
    image: mysql:8.4
    container_name: hal-cinema-mysql-test
    ports:
      - '${MYSQL_TEST_PORT:-3307}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_TEST_ROOT_PASSWORD:-root}'
      MYSQL_DATABASE: '${MYSQL_TEST_DATABASE:-hal_cinema_test}'
      MYSQL_USER: '${MYSQL_TEST_USER:-hal_user}'
      MYSQL_PASSWORD: '${MYSQL_TEST_PASSWORD:-hal_pass}'
      TZ: '${TZ:-Asia/Tokyo}'
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${MYSQL_TEST_ROOT_PASSWORD:-root}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_test_data:

name: Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy environment
        required: true
        default: production
        type: choice
        options:
          - production
          - development

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: 変更アプリを判定
        id: changed
        env:
          PR_BASE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.sha }}
        run: node scripts/detect-changed-apps.mjs

      - name: デプロイ設定を生成
        env:
          PAGES_BRANCH: ${{ github.ref_name }}
          USER_PAGES_PROJECT: ${{ vars.USER_PAGES_PROJECT }}
          STAFF_PAGES_PROJECT: ${{ vars.STAFF_PAGES_PROJECT }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          API_SERVICE_NAME: ${{ vars.API_SERVICE_NAME }}
        run: node scripts/prepare-wrangler.mjs

      - name: API Workerをデプロイ
        if: steps.changed.outputs.api == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.generated.jsonc

      - name: D1 migrationを適用
        if: steps.changed.outputs.api == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply "${{ vars.D1_DATABASE_NAME }}" --remote --config wrangler.generated.jsonc

      - name: マスターデータを投入
        if: steps.changed.outputs.api == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute "${{ vars.D1_DATABASE_NAME }}" --remote --file=d1/seed.sql --config wrangler.generated.jsonc

      - name: APIの秘密値を同期
        if: steps.changed.outputs.api == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.generated.jsonc

      - name: 公開サイトと管理画面をビルド
        if: (steps.changed.outputs.user == 'true' || steps.changed.outputs.staff == 'true') && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ steps.changed.outputs.user }}" = "true" ]; then
            npm run build --workspace apps/user
          fi
          if [ "${{ steps.changed.outputs.staff }}" = "true" ]; then
            npm run build --workspace apps/staff
          fi

      - name: 公開サイトをデプロイ
        if: steps.changed.outputs.user == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/user
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy build/client --project-name "${{ vars.USER_PAGES_PROJECT }}" --branch "${{ github.ref_name }}" --config wrangler.generated.toml

      - name: 管理画面をデプロイ
        if: steps.changed.outputs.staff == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/staff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy build/client --project-name "${{ vars.STAFF_PAGES_PROJECT }}" --branch "${{ github.ref_name }}" --config wrangler.generated.toml

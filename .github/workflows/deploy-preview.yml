name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview to Cloudflare
    runs-on: ubuntu-latest
    environment: preview

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: 変更アプリを判定
        id: changed
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-changed-apps.mjs

      - name: デプロイ設定を生成
        env:
          CONFIG_TARGETS: user,staff
          PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
          USER_PAGES_PROJECT: ${{ vars.USER_PAGES_PROJECT }}
          STAFF_PAGES_PROJECT: ${{ vars.STAFF_PAGES_PROJECT }}
          API_SERVICE_NAME: ${{ vars.API_SERVICE_NAME }}
        run: node scripts/prepare-wrangler.mjs

      - name: 公開サイトをビルド
        if: steps.changed.outputs.user == 'true'
        run: npm run build --workspace apps/user

      - name: 管理画面をビルド
        if: steps.changed.outputs.staff == 'true'
        run: npm run build --workspace apps/staff

      - name: 公開サイトプレビューをデプロイ
        if: steps.changed.outputs.user == 'true'
        working-directory: apps/user
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy build/client --project-name "${{ vars.USER_PAGES_PROJECT }}" --branch "pr-${{ github.event.pull_request.number }}" --config wrangler.generated.toml

      - name: 管理画面プレビューをデプロイ
        if: steps.changed.outputs.staff == 'true'
        working-directory: apps/staff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy build/client --project-name "${{ vars.STAFF_PAGES_PROJECT }}" --branch "pr-${{ github.event.pull_request.number }}" --config wrangler.generated.toml

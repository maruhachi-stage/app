name: CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      staff: ${{ steps.filter.outputs.staff }}
      api: ${{ steps.filter.outputs.api }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 変更アプリを判定
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-changed-apps.mjs

  frontend:
    name: Web
    needs: changes
    if: needs.changes.outputs.user == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 依存関係をインストール
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check --workspace apps/user

      - name: Lint
        run: npm run lint --workspace apps/user

      - name: Typecheck
        run: npm run typecheck --workspace apps/user

      - name: Test
        run: npm test --workspace apps/user

      - name: Build
        run: npm run build --workspace apps/user

  staff:
    name: Staff
    needs: changes
    if: needs.changes.outputs.staff == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 依存関係をインストール
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check --workspace apps/staff

      - name: Lint
        run: npm run lint --workspace apps/staff

      - name: Typecheck
        run: npm run typecheck --workspace apps/staff

      - name: Test
        run: npm test --workspace apps/staff

      - name: Build
        run: npm run build --workspace apps/staff

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 依存関係をインストール
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check --workspace apps/api

      - name: Lint
        run: npm run lint --workspace apps/api

      - name: Typecheck
        run: npm run typecheck --workspace apps/api

      - name: Test
        run: npm test --workspace apps/api

      - name: Build
        run: npm run build --workspace apps/api

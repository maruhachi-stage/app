name: Deploy API

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy environment
        required: true
        default: production
        type: choice
        options:
          - production
          - development

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API Worker to Cloudflare
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: 変更アプリを判定
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          ALL_CHANGED: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/detect-changed-apps.mjs

      - name: デプロイ設定を生成
        if: steps.changed.outputs.api == 'true'
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}
          CONFIG_TARGETS: api
          USER_PAGES_PROJECT: ${{ vars.USER_PAGES_PROJECT }}
          STAFF_PAGES_PROJECT: ${{ vars.STAFF_PAGES_PROJECT }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          API_SERVICE_NAME: ${{ vars.API_SERVICE_NAME }}
        run: node scripts/prepare-wrangler.mjs

      - name: API Workerをデプロイ
        if: steps.changed.outputs.api == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.generated.jsonc

      - name: D1 migrationを適用
        if: steps.changed.outputs.api == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply "${{ vars.D1_DATABASE_NAME }}" --remote --config wrangler.generated.jsonc

      - name: マスターデータを投入
        if: steps.changed.outputs.api == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute "${{ vars.D1_DATABASE_NAME }}" --remote --file=d1/seed.sql --config wrangler.generated.jsonc

      - name: APIの秘密情報を同期
        if: steps.changed.outputs.api == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.generated.jsonc

name: CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      staff: ${{ steps.filter.outputs.staff }}
      api: ${{ steps.filter.outputs.api }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 変更アプリを判定
        id: filter
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "user=true" >> "$GITHUB_OUTPUT"
            echo "staff=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"

          shared=false
          while IFS= read -r file; do
            case "$file" in
              .github/*|.editorconfig|AGENTS.md|README.md|SETUP.md|package.json|package-lock.json)
                shared=true
                ;;
            esac
          done <<< "$files"

          for app in user staff api; do
            changed=false
            while IFS= read -r file; do
              case "$app:$file" in
                user:apps/user/*) changed=true ;;
                staff:apps/staff/*) changed=true ;;
                api:apps/api/*) changed=true ;;
              esac
            done <<< "$files"

            if [ "$shared" = "true" ]; then
              changed=true
            fi

            echo "$app=$changed" >> "$GITHUB_OUTPUT"
          done

  frontend:
    name: Web
    needs: changes
    if: needs.changes.outputs.user == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check --workspace apps/user

      - name: Lint
        run: npm run lint --workspace apps/user

      - name: Typecheck
        run: npm run typecheck --workspace apps/user

      - name: Test
        run: npm test --workspace apps/user

      - name: Build
        run: npm run build --workspace apps/user

  staff:
    name: Staff
    needs: changes
    if: needs.changes.outputs.staff == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check --workspace apps/staff

      - name: Lint
        run: npm run lint --workspace apps/staff

      - name: Typecheck
        run: npm run typecheck --workspace apps/staff

      - name: Test
        run: npm test --workspace apps/staff

      - name: Build
        run: npm run build --workspace apps/staff

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check --workspace apps/api

      - name: Lint
        run: npm run lint --workspace apps/api

      - name: Typecheck
        run: npm run typecheck --workspace apps/api

      - name: Test
        run: npm test --workspace apps/api

      - name: Build
        run: npm run build --workspace apps/api

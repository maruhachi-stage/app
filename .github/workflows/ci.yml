name: CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      front: ${{ steps.filter.outputs.front }}
      admin: ${{ steps.filter.outputs.admin }}
      back: ${{ steps.filter.outputs.back }}
      image: ${{ steps.filter.outputs.image }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 変更アプリを判定
        id: filter
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "front=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            echo "back=true" >> "$GITHUB_OUTPUT"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"

          shared=false
          while IFS= read -r file; do
            case "$file" in
              .github/*|.editorconfig|AGENTS.md|README.md|SETUP.md)
                shared=true
                ;;
            esac
          done <<< "$files"

          for app in front admin back image; do
            changed=false
            while IFS= read -r file; do
              case "$app:$file" in
                front:front-web/*) changed=true ;;
                admin:admin-web/*) changed=true ;;
                back:back-api/*) changed=true ;;
                image:image-server/*) changed=true ;;
              esac
            done <<< "$files"

            if [ "$shared" = "true" ]; then
              changed=true
            fi

            echo "$app=$changed" >> "$GITHUB_OUTPUT"
          done

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-web

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-web/package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  admin:
    name: Admin
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-api

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-api/package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Test
        run: npm test

      - name: Build
        run: npm run build

      - name: テスト用MySQLを起動
        run: npm run db:test:up

      - name: マイグレーションを適用
        run: npm run db:test:migrate

      - name: Integration Test
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_NAME: hal_cinema_test
          DB_USER: hal_user
          DB_PASSWORD: hal_pass
        run: npm run test:integration

      - name: テスト用MySQLを停止
        if: always()
        run: npm run db:test:down

  image-server:
    name: Image Server
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-server

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: image-server/package-lock.json

      - name: 依存関係をインストール
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
